# GitLab CI/CD for the Discord music bot.
# Builds a Docker image with Kaniko (no privileged Docker-in-Docker needed) and
# pushes it to the project's GitLab Container Registry. Deployment happens on the
# target server itself: a cron there runs `docker compose pull && docker compose
# up -d` to roll out the freshly pushed :latest image — no deploy job here.

stages:
  - lint
  - build

variables:
  IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

# --- Lint: syntax + module load (catches breakage before building an image) ---
lint:
  stage: lint
  image: node:22-bookworm-slim
  script:
    - npm ci
    - node --check src/index.js
    - node -e "require('./src/sources');require('./src/commands')"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

# --- Build & push image to the GitLab Container Registry via Kaniko ---
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE_SHA"
      --destination "$IMAGE_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
