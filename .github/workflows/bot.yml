name: Bot CI

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  pull_request:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  # Weekly rebuild so the image keeps a fresh yt-dlp (YouTube extraction breaks
  # over time). Mondays 04:00 UTC. Also runnable manually.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  # Lint: syntax + module load (catches breakage before building an image).
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: node --check src/index.js
      - run: node -e "require('./src/sources');require('./src/commands');require('./src/player')"

  # Build the Docker image and push it to the GitHub Container Registry (GHCR).
  build:
    needs: lint
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces lowercased image tags (GHCR requires lowercase names).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: bot
          push: true
          # Scheduled/manual rebuilds skip the cache so the yt-dlp download layer
          # is actually re-fetched (otherwise it stays cached and stale).
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
